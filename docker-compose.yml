# ds1／正式：僅 api（＋可選 web profile）。本機開發勿用此 compose 起 DB——用專案根 data/attendance.db + npm run dev。
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 容器內掛卷路徑（對齊教育訓練：/data/*.db）
      DATABASE_URL: file:/data/attendance.db
      PORT: '3000'
      # 正式 HTTPS 請改 COOKIE_SECURE=true
      COOKIE_SECURE: 'false'
      # 僅「首次建立 Admin」時一次性提供 ADMIN_SEED_PASSWORD（≥12 碼，含大小寫、數字、符號）；
      # 建立後請從 .env 移除。之後改密碼：docker compose exec -it api node dist/prisma/reset-admin-password.js
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_PIN: ${ADMIN_SEED_PIN:-}
    ports:
      - '3000:3000'
    volumes:
      # 本機驗證映像時掛專案 data/；ds1 請改 ${DATA_ROOT}/attendance:/data
      - ${ATTENDANCE_DATA:-./data}:/data

  # 需在「企業入口網站」根目錄建置（含 0.shared-ui）：
  #   docker compose -f 1.出勤加班單系統/docker-compose.yml --profile full up -d --build
  web:
    profiles: ['full']
    build:
      context: ..
      dockerfile: 1.出勤加班單系統/Dockerfile.compose
    ports:
      - '8080:8080'
    depends_on:
      - api
