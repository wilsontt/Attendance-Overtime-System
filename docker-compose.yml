services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - '5432:5432'
    volumes:
      - attendance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attendance -d attendance']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance?schema=public
      PORT: '3000'
      COOKIE_SECURE: 'false'
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-ChangeMeAdmin!}
      ADMIN_SEED_PIN: ${ADMIN_SEED_PIN:-0000}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  # 需在「企業入口網站」根目錄建置（含 0.shared-ui）：
  #   docker compose -f 1.出勤加班單系統/docker-compose.yml up -d --build
  # 或僅起 DB／API：docker compose up -d db api
  web:
    profiles: ['full']
    build:
      context: ..
      dockerfile: 1.出勤加班單系統/Dockerfile.compose
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  attendance_pg_data:
